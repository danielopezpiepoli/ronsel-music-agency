backend:
  name: git-gateway
  branch: main

# Dónde se guardan las imágenes subidas por el panel
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "artists"
    label: "Artistas"
    folder: "data/artists"
    create: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    fields:
      - { label: "Identificador (URL)", name: "id", widget: "string", hint: "Ej: laura-perez (sin espacios ni acentos)" }
      - { label: "Nombre del Artista", name: "name", widget: "string" }
      - { label: "Disciplina / Rol", name: "discipline", widget: "string", hint: "Ej: Directora de orquesta, Cuarteto de cuerdas, Pianista" }
      - { label: "Foto Principal", name: "avatar", widget: "image" }
      - { label: "Biografía", name: "bio", widget: "markdown" }
      - label: "Galería de Fotos"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Imagen", name: "image", widget: "image" }
      - label: "Enlaces de YouTube"
        name: "youtube_links"
        widget: "list"
        required: false
        field: { label: "URL del Video", name: "url", widget: "string", hint: "Pega el enlace tal cual de YouTube" }